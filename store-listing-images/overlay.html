<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>飞鱼加速器 - 上架宣传图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 40px; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }

  .slide {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    border-radius: 8px;
  }

  /* Background image layer */
  .slide .bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
  }

  /* Dark overlay to mute background text */
  .slide .overlay {
    position: absolute;
    inset: 0;
  }

  /* Content layer */
  .slide .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }

  /* ===== SLIDE 2: 国外加速 国内漫游 ===== */
  #slide2 .bg {
    background-image: url('./bg_002.png');
  }
  #slide2 .overlay {
    background: linear-gradient(
      180deg,
      rgba(10, 14, 26, 0.95) 0%,
      rgba(10, 14, 26, 0.7) 25%,
      rgba(10, 14, 26, 0.3) 45%,
      rgba(10, 14, 26, 0.3) 65%,
      rgba(10, 14, 26, 0.85) 85%,
      rgba(10, 14, 26, 0.95) 100%
    );
  }

  /* ===== SLIDE 3: 跨境十年 良心之作 ===== */
  #slide3 .bg {
    background-image: url('./bg_003.png');
  }
  #slide3 .overlay {
    background: linear-gradient(
      180deg,
      rgba(10, 14, 26, 0.95) 0%,
      rgba(10, 14, 26, 0.75) 22%,
      rgba(10, 14, 26, 0.35) 40%,
      rgba(10, 14, 26, 0.35) 60%,
      rgba(10, 14, 26, 0.8) 80%,
      rgba(10, 14, 26, 0.95) 100%
    );
  }

  /* ===== SLIDE 4: 专业团队 运营支持 ===== */
  #slide4 .bg {
    background-image: url('./bg_004.png');
  }
  #slide4 .overlay {
    background: linear-gradient(
      180deg,
      rgba(10, 14, 26, 0.95) 0%,
      rgba(10, 14, 26, 0.7) 25%,
      rgba(10, 14, 26, 0.3) 45%,
      rgba(10, 14, 26, 0.3) 65%,
      rgba(10, 14, 26, 0.85) 85%,
      rgba(10, 14, 26, 0.95) 100%
    );
  }

  /* === Common text styles === */
  .title {
    font-size: 82px;
    font-weight: 900;
    color: #FF6B00;
    letter-spacing: 8px;
    text-shadow: 0 4px 30px rgba(255, 107, 0, 0.4), 0 0 60px rgba(255, 107, 0, 0.15);
    text-align: center;
    line-height: 1.3;
  }

  .subtitle {
    font-size: 38px;
    font-weight: 400;
    color: #9CA3AF;
    letter-spacing: 6px;
    text-align: center;
    margin-top: 20px;
  }

  .bottom-text {
    font-size: 42px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 6px;
    text-align: center;
    text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
    line-height: 1.6;
  }

  .tag-line {
    font-size: 28px;
    color: rgba(0, 212, 255, 0.6);
    letter-spacing: 4px;
    text-align: center;
    margin-top: 12px;
  }

  .divider {
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.5), transparent);
    margin: 16px 0;
  }

  /* Position helpers */
  .top-section {
    padding-top: 140px;
  }

  .bottom-section {
    position: absolute;
    bottom: 120px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .app-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 28px;
    border-radius: 50px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 3px;
  }

  .badge-cyan {
    color: rgba(0, 212, 255, 0.8);
    background: rgba(0, 212, 255, 0.1);
    border: 1px solid rgba(0, 212, 255, 0.2);
  }

  .badge-gold {
    color: rgba(255, 184, 0, 0.8);
    background: rgba(255, 184, 0, 0.1);
    border: 1px solid rgba(255, 184, 0, 0.2);
  }

  .cta-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 36px;
    border-radius: 50px;
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 180, 255, 0.1));
    border: 1px solid rgba(0, 212, 255, 0.25);
    color: rgba(0, 212, 255, 0.9);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 4px;
    margin-top: 24px;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
  }

  .logo-area img {
    width: 48px;
    height: 48px;
    border-radius: 12px;
  }

  .logo-area span {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, #00D4FF, #00B8A9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 4px;
  }
</style>
</head>
<body>

<!-- ========== SLIDE 2: 国外加速 国内漫游 ========== -->
<div class="slide" id="slide2">
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="top-section" style="display:flex;flex-direction:column;align-items:center;">
      <div class="title">国外加速<br>国内漫游</div>
      <div class="subtitle">多区域 · 多线路 · 多出口</div>
      <div style="display:flex;gap:16px;margin-top:36px;">
        <span class="app-badge badge-cyan">🌏 全球节点</span>
        <span class="app-badge badge-cyan">⚡ 极速连接</span>
      </div>
    </div>
    <div class="bottom-section">
      <div class="divider"></div>
      <div class="tag-line">全球加速 · 畅通无阻</div>
      <div class="logo-area">
        <img src="../public/images/fy-logo001.png" alt="logo">
        <span>飞鱼加速器</span>
      </div>
    </div>
  </div>
</div>

<!-- ========== SLIDE 3: 跨境十年 良心之作 ========== -->
<div class="slide" id="slide3">
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="top-section" style="display:flex;flex-direction:column;align-items:center;">
      <div class="title">跨境十年<br>良心之作</div>
      <div class="subtitle">无套路 · 有底线 · 会员轻松得</div>
      <div style="display:flex;gap:16px;margin-top:36px;">
        <span class="app-badge badge-gold">🏆 十年品质</span>
        <span class="app-badge badge-gold">💎 免费会员</span>
      </div>
    </div>
    <div class="bottom-section">
      <div class="bottom-text">一键开启<br>网络之门</div>
      <div class="divider"></div>
      <div class="logo-area">
        <img src="../public/images/fy-logo001.png" alt="logo">
        <span>飞鱼加速器</span>
      </div>
    </div>
  </div>
</div>

<!-- ========== SLIDE 4: 专业团队 运营支持 ========== -->
<div class="slide" id="slide4">
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="top-section" style="display:flex;flex-direction:column;align-items:center;">
      <div class="title">专业团队<br>运营支持</div>
      <div class="subtitle">免费使用 · 不兑服务</div>
      <div style="display:flex;gap:16px;margin-top:36px;">
        <span class="app-badge badge-cyan">🛡️ 持续运营</span>
        <span class="app-badge badge-cyan">💬 贴心服务</span>
      </div>
    </div>
    <div class="bottom-section">
      <div class="divider"></div>
      <div class="tag-line">专业可靠 · 安心使用</div>
      <div class="logo-area">
        <img src="../public/images/fy-logo001.png" alt="logo">
        <span>飞鱼加速器</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
